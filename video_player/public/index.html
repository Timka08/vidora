<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        font-family: Arial, sans-serif;
      }

      .video-wrap {
        width: min(900px, 90vw);
        background: #000;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      video {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="video-wrap">
      <video muted playsinline controls>
        <source src="../test video/FLOWER.mp4" type="video/mp4" />
        Ваш браузер не поддерживает видео тег.
      </video>
    </div>
    <script type="module" src="../dist/main.js" defer></script>
  </body>
</html>
